<style>
        /* Base styles to ensure consistency and prevent FOUC */
        body { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        
        /* Custom scrollbar for dark theme */

        ::-webkit-scrollbar-track { background: transparent; }

    body {
      min-height: max(884px, 100dvh);
    }

  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md relative selection:bg-primary-container selection:text-on-primary-container">
<!-- Transactional Header -->
<header class="bg-surface-dim top-0 sticky border-b border-outline-variant flex justify-between items-center px-margin-mobile py-sm w-full z-40 transition-colors">
<!-- Cancel Action (Left) -->
<button class="text-primary hover:bg-surface-container-high active:scale-95 duration-150 transition-all rounded-lg px-3 py-2 font-body-md text-body-md flex items-center gap-2" type="button">
<span aria-hidden="true" class="material-symbols-outlined text-[20px]">close</span>
<span class="hidden md:inline">Cancel</span>
</button>
<!-- Screen Title (Center) -->
<h1 class="font-headline-sm text-headline-sm font-bold text-on-surface absolute left-1/2 transform -translate-x-1/2">
            Add Host
        </h1>
<!-- Spacer for alignment -->
<div class="w-[72px] md:w-[90px]"></div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 w-full max-w-2xl mx-auto px-margin-mobile md:px-0 py-lg pb-32">
<form class="space-y-lg flex flex-col" id="addHostForm">
<!-- SECTION: Identity & Organization -->
<section class="bg-surface-container border border-outline-variant rounded-xl overflow-hidden shadow-sm">
<div class="px-md py-sm border-b border-outline-variant bg-surface-container-low flex items-center gap-2">
<span class="material-symbols-outlined text-outline text-[18px]">bookmark</span>
<h2 class="font-label-mono-md text-label-mono-md text-on-surface-variant uppercase tracking-wider">Identity</h2>
</div>
<div class="p-md space-y-md">
<!-- Label / Alias -->
<div class="flex flex-col space-y-xs">
<label class="font-label-mono-sm text-label-mono-sm text-on-surface-variant flex justify-between" for="hostLabel">
<span>Label / Alias</span>
<span class="text-outline text-opacity-50">Required</span>
</label>
<input class="bg-background text-on-surface font-body-md text-body-md border border-outline-variant rounded-lg px-3 py-2 focus:ring-2 focus:ring-primary focus:border-primary focus:outline-none placeholder:text-outline transition-shadow shadow-inner" id="hostLabel" placeholder="e.g., Web Server Alpha" required="" type="text"/>
</div>
<!-- Group / Category -->
<div class="flex flex-col space-y-xs">
<label class="font-label-mono-sm text-label-mono-sm text-on-surface-variant" for="hostGroup">Group / Category</label>
<div class="relative">
<select class="appearance-none bg-background text-on-surface font-body-md text-body-md border border-outline-variant rounded-lg px-3 py-2 w-full focus:ring-2 focus:ring-primary focus:border-primary focus:outline-none shadow-inner pr-10" id="hostGroup">
<option disabled="" selected="" value="">Select a group...</option>
<option value="production">Production</option>
<option value="staging">Staging</option>
<option value="development">Development</option>
<option value="personal">Personal</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 transform -translate-y-1/2 text-outline pointer-events-none">expand_more</span>
</div>
</div>
</div>
</section>
<!-- SECTION: Connection Details -->
<section class="bg-surface-container border border-outline-variant rounded-xl overflow-hidden shadow-sm">
<div class="px-md py-sm border-b border-outline-variant bg-surface-container-low flex items-center gap-2">
<span class="material-symbols-outlined text-outline text-[18px]">dns</span>
<h2 class="font-label-mono-md text-label-mono-md text-on-surface-variant uppercase tracking-wider">Connection</h2>
</div>
<div class="p-md flex flex-col md:flex-row gap-md">
<!-- Hostname / IP -->
<div class="flex flex-col space-y-xs flex-1">
<label class="font-label-mono-sm text-label-mono-sm text-on-surface-variant flex justify-between" for="hostAddress">
<span>Hostname or IP Address</span>
<span class="text-outline text-opacity-50">Required</span>
</label>
<input class="bg-background text-on-surface font-label-mono-md text-label-mono-md border border-outline-variant rounded-lg px-3 py-2 focus:ring-2 focus:ring-primary focus:border-primary focus:outline-none placeholder:text-outline transition-shadow shadow-inner" id="hostAddress" placeholder="192.168.1.1" required="" type="text"/>
</div>
<!-- Port -->
<div class="flex flex-col space-y-xs w-full md:w-32">
<label class="font-label-mono-sm text-label-mono-sm text-on-surface-variant" for="hostPort">Port</label>
<input class="bg-background text-on-surface font-label-mono-md text-label-mono-md border border-outline-variant rounded-lg px-3 py-2 focus:ring-2 focus:ring-primary focus:border-primary focus:outline-none placeholder:text-outline transition-shadow shadow-inner text-right" id="hostPort" max="65535" min="1" type="number" value="22"/>
</div>
</div>
</section>
<!-- SECTION: Authentication -->
<section class="bg-surface-container border border-outline-variant rounded-xl overflow-hidden shadow-sm">
<div class="px-md py-sm border-b border-outline-variant bg-surface-container-low flex items-center gap-2">
<span class="material-symbols-outlined text-outline text-[18px]">key</span>
<h2 class="font-label-mono-md text-label-mono-md text-on-surface-variant uppercase tracking-wider">Authentication</h2>
</div>
<div class="p-md space-y-md">
<!-- Auth Type Selector (Segmented Control) -->
<div class="flex flex-col space-y-xs">
<label class="font-label-mono-sm text-label-mono-sm text-on-surface-variant">Method</label>
<div class="flex bg-background p-1 rounded-lg border border-outline-variant shadow-inner" role="group">
<button class="flex-1 py-1.5 bg-surface-container-high rounded-md text-primary font-label-mono-md text-label-mono-md shadow-sm border border-outline-variant transition-colors flex items-center justify-center gap-2" id="authTypePasswordBtn" type="button">
<span class="material-symbols-outlined text-[16px]">password</span>
                                Password
                            </button>
<button class="flex-1 py-1.5 text-on-surface-variant font-label-mono-md text-label-mono-md hover:text-on-surface hover:bg-surface-container-lowest rounded-md transition-colors flex items-center justify-center gap-2" id="authTypeKeyBtn" type="button">
<span class="material-symbols-outlined text-[16px]">vpn_key</span>
                                Key Pair
                            </button>
</div>
</div>
<!-- Username -->
<div class="flex flex-col space-y-xs">
<label class="font-label-mono-sm text-label-mono-sm text-on-surface-variant flex justify-between" for="authUsername">
<span>Username</span>
<span class="text-outline text-opacity-50">Required</span>
</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-outline">person</span>
<input class="bg-background text-on-surface font-label-mono-md text-label-mono-md border border-outline-variant rounded-lg pl-10 pr-3 py-2 w-full focus:ring-2 focus:ring-primary focus:border-primary focus:outline-none placeholder:text-outline transition-shadow shadow-inner" id="authUsername" placeholder="root" required="" type="text"/>
</div>
</div>
<!-- Password Field (Visible by default based on segmented control) -->
<div class="flex flex-col space-y-xs" id="passwordFieldContainer">
<label class="font-label-mono-sm text-label-mono-sm text-on-surface-variant" for="authPassword">Password</label>
<div class="relative flex items-center">
<input class="bg-background text-on-surface font-label-mono-md text-label-mono-md border border-outline-variant rounded-lg px-3 py-2 w-full focus:ring-2 focus:ring-primary focus:border-primary focus:outline-none placeholder:text-outline transition-shadow shadow-inner" id="authPassword" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Key Pair Field (Hidden by default) -->
<div class="hidden flex-col space-y-xs" id="keyPairFieldContainer">
<label class="font-label-mono-sm text-label-mono-sm text-on-surface-variant" for="authKey">Private Key</label>
<div class="relative">
<select class="appearance-none bg-background text-on-surface font-body-md text-body-md border border-outline-variant rounded-lg px-3 py-2 w-full focus:ring-2 focus:ring-primary focus:border-primary focus:outline-none shadow-inner pr-10" id="authKey">
<option disabled="" selected="" value="">Select saved key...</option>
<option value="key1">id_rsa_personal</option>
<option value="key2">aws_prod_key.pem</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 transform -translate-y-1/2 text-outline pointer-events-none">expand_more</span>
</div>
<p class="font-label-mono-sm text-label-mono-sm text-outline mt-1 flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]">info</span>
                            Keys can be managed in Settings.
                        </p>
</div>
</div>
</section>
</form>
</main>
<!-- Bottom Action Area (Sticky) -->
<div class="fixed bottom-0 left-0 w-full bg-surface-dim border-t border-outline-variant p-margin-mobile pb-safe flex justify-end items-center z-40 shadow-[0_-4px_24px_rgba(0,0,0,0.5)]">
<div class="w-full max-w-2xl mx-auto flex justify-end">
<button class="w-full md:w-auto bg-primary text-on-primary font-headline-sm text-headline-sm font-semibold px-xl py-3 rounded-lg shadow-md hover:bg-primary-container hover:text-on-primary-container active:scale-95 transition-all flex items-center justify-center gap-2" form="addHostForm" type="submit">
<span aria-hidden="true" class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">save</span>
                Save Host
            </button>
</div>
</div>
<!-- Micro-interactions Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const btnPassword = document.getElementById('authTypePasswordBtn');
            const btnKey = document.getElementById('authTypeKeyBtn');
            const containerPassword = document.getElementById('passwordFieldContainer');
            const containerKey = document.getElementById('keyPairFieldContainer');

            // Active State Classes for Segmented Control
            const activeClasses = ['bg-surface-container-high', 'text-primary', 'shadow-sm', 'border', 'border-outline-variant'];
            const inactiveClasses = ['text-on-surface-variant', 'hover:text-on-surface', 'hover:bg-surface-container-lowest'];

            function setAuthType(type) {
                if (type === 'password') {
                    // Update Buttons
                    btnPassword.classList.add(...activeClasses);
                    btnPassword.classList.remove(...inactiveClasses);
                    
                    btnKey.classList.remove(...activeClasses);
                    btnKey.classList.add(...inactiveClasses);
                    
                    // Update Form Fields
                    containerPassword.classList.remove('hidden');
                    containerPassword.classList.add('flex');
                    containerKey.classList.add('hidden');
                    containerKey.classList.remove('flex');
                } else {
                    // Update Buttons
                    btnKey.classList.add(...activeClasses);
                    btnKey.classList.remove(...inactiveClasses);
                    
                    btnPassword.classList.remove(...activeClasses);
                    btnPassword.classList.add(...inactiveClasses);
                    
                    // Update Form Fields
                    containerKey.classList.remove('hidden');
                    containerKey.classList.add('flex');
                    containerPassword.classList.add('hidden');
                    containerPassword.classList.remove('flex');
                }
            }

            btnPassword.addEventListener('click', () => setAuthType('password'));
            btnKey.addEventListener('click', () => setAuthType('key'));
        });
    </script>
</body></html>
