<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Terminal Command Input</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-bright": "#353940",
                        "primary": "#a2c9ff",
                        "inverse-surface": "#dfe2eb",
                        "surface-container-high": "#262a31",
                        "on-secondary-fixed-variant": "#005317",
                        "surface-dim": "#10141a",
                        "on-background": "#dfe2eb",
                        "on-error-container": "#ffdad6",
                        "on-tertiary-fixed": "#270058",
                        "secondary-container": "#27a640",
                        "on-tertiary-container": "#4c069d",
                        "secondary-fixed-dim": "#67df70",
                        "surface-container-lowest": "#0a0e14",
                        "inverse-primary": "#0060aa",
                        "surface-container": "#1c2026",
                        "primary-fixed": "#d3e4ff",
                        "inverse-on-surface": "#2d3137",
                        "surface": "#10141a",
                        "on-secondary-fixed": "#002105",
                        "surface-tint": "#a2c9ff",
                        "on-primary-fixed-variant": "#004882",
                        "on-secondary": "#00390d",
                        "tertiary-fixed-dim": "#d5bbff",
                        "tertiary-fixed": "#ecdcff",
                        "on-tertiary-fixed-variant": "#5a21ab",
                        "surface-container-highest": "#31353c",
                        "secondary": "#67df70",
                        "outline-variant": "#414752",
                        "background": "#10141a",
                        "on-primary-container": "#003a6b",
                        "on-primary": "#00315c",
                        "tertiary-container": "#b88eff",
                        "on-tertiary": "#41008b",
                        "outline": "#8b919d",
                        "error-container": "#93000a",
                        "primary-fixed-dim": "#a2c9ff",
                        "surface-variant": "#31353c",
                        "on-error": "#690005",
                        "tertiary": "#d5bbff",
                        "surface-container-low": "#181c22",
                        "secondary-fixed": "#83fc89",
                        "error": "#ffb4ab",
                        "primary-container": "#58a6ff",
                        "on-surface-variant": "#c0c7d4",
                        "on-primary-fixed": "#001c38",
                        "on-surface": "#dfe2eb",
                        "on-secondary-container": "#00320a"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "base": "4px",
                        "margin-mobile": "16px",
                        "xl": "32px",
                        "sm": "8px",
                        "gutter": "16px",
                        "margin-desktop": "48px",
                        "lg": "24px",
                        "md": "16px",
                        "xs": "4px",
                        "safe-margin": "16px"
                    },
                    "fontFamily": {
                        "headline-sm": ["Inter"],
                        "headline-lg": ["Inter"],
                        "headline-md": ["Inter"],
                        "body-md": ["Inter"],
                        "label-mono-md": ["JetBrains Mono"],
                        "label-mono-sm": ["JetBrains Mono"],
                        "headline-lg-mobile": ["Inter"],
                        "body-lg": ["Inter"]
                    },
                    "fontSize": {
                        "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "500" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "label-mono-md": ["14px", { "lineHeight": "20px", "fontWeight": "500" }],
                        "label-mono-sm": ["12px", { "lineHeight": "16px", "fontWeight": "400" }],
                        "headline-lg-mobile": ["26px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        
        /* Custom scrollbar for text area */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent; 
        }
        ::-webkit-scrollbar-thumb {
            background: #414752; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #8b919d; 
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background h-screen w-full overflow-hidden flex flex-col relative">
<!-- Top App Bar (Background Context) -->
<header class="flex justify-between items-center w-full px-safe-margin h-16 bg-surface border-b border-white/10 opacity-40 blur-[1px]">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-primary-fixed-dim">arrow_back_ios</span>
<div class="flex items-center gap-2 bg-secondary-container/20 px-3 py-1.5 rounded-full border border-secondary-container/30">
<span class="material-symbols-outlined text-secondary-container text-[18px]">dns</span>
<span class="text-secondary-container font-label-mono-md text-label-mono-md">acme-db-dev-us-...</span>
</div>
</div>
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-on-surface-variant">search</span>
<span class="material-symbols-outlined text-on-surface-variant">more_vert</span>
</div>
</header>
<!-- Background Terminal Output -->
<main class="flex-1 p-safe-margin overflow-hidden opacity-40 blur-[2px] pointer-events-none">
<div class="font-label-mono-sm text-label-mono-sm space-y-1">
<div class="flex"><span class="text-primary-fixed-dim w-32">Logged as:</span><span class="text-secondary-fixed-dim">stan@acme-prod</span></div>
<div class="flex"><span class="text-primary-fixed-dim w-32">OS:</span><span class="text-secondary-fixed-dim">Ubuntu 22.04.5 LTS (Jammy Jellyfish)</span></div>
<div class="flex"><span class="text-primary-fixed-dim w-32">IP addresses:</span><span class="text-secondary-fixed-dim">137.184.95.44</span></div>
<div class="flex"><span class="text-primary-fixed-dim w-32">Uptime:</span><span class="text-secondary-fixed-dim">1 year, 4 weeks, 2 days</span></div>
<div class="flex mt-4"><span class="text-secondary-fixed-dim">stan@acme-prod:~$</span><span class="w-2 h-4 bg-secondary-fixed-dim ml-2 animate-pulse"></span></div>
</div>
</main>
<!-- Modal Overlay -->
<div class="absolute inset-0 bg-background/60 backdrop-blur-sm z-10 flex flex-col justify-end pointer-events-auto pb-[280px]"> <!-- pb leaves space for keyboard -->
<!-- Expanded Input Modal -->
<div class="bg-surface-container-high rounded-t-xl border-t border-outline-variant shadow-[0_-8px_32px_rgba(0,0,0,0.5)] mx-0 sm:mx-safe-margin sm:rounded-xl sm:border sm:mb-4 sm:pb-0 h-[397px] flex flex-col">
<!-- Modal Header -->
<div class="flex justify-between items-center p-md border-b border-white/5">
<div class="flex items-center gap-2 text-on-surface-variant">
<span class="material-symbols-outlined text-[18px]">terminal</span>
<span class="font-label-mono-md text-label-mono-md">Command Editor</span>
</div>
<button class="text-on-surface-variant hover:text-on-surface transition-colors">
<span class="material-symbols-outlined">close_fullscreen</span>
</button>
</div>
<!-- Text Area -->
<div class="flex-1 p-md relative">
<textarea autofocus="" class="w-full h-full bg-surface-container-lowest text-on-surface font-label-mono-md text-label-mono-md p-md rounded-lg border border-outline-variant focus:border-primary-fixed-dim focus:ring-1 focus:ring-primary-fixed-dim outline-none resize-none" placeholder="Enter multi-line command here...">docker run -d \
  --name prometheus \
  -p 9090:9090 \
  -v /path/to/prometheus.yml:/etc/prometheus/prometheus.yml \
  prom/prometheus</textarea>
<!-- Cursor simulation (optional, standard textarea caret is usually fine, but for aesthetic) -->
</div>
<!-- Modal Actions -->
<div class="p-md border-t border-white/5 flex justify-end gap-3 bg-surface-container">
<button class="px-4 py-2 rounded-lg font-body-md text-body-md text-on-surface-variant hover:text-on-surface border border-outline-variant hover:bg-surface-container-highest transition-colors">
                    Clear
                </button>
<button class="px-6 py-2 rounded-lg font-body-md text-body-md font-medium bg-primary-container text-on-primary-container hover:opacity-90 transition-opacity flex items-center gap-2 shadow-[0_0_12px_rgba(88,166,255,0.2)]">
<span class="material-symbols-outlined text-[18px]">play_arrow</span>
                    Execute
                </button>
</div>
</div>
</div>
<!-- Specialized Keyboard (Foreground) -->
<div class="absolute bottom-0 w-full z-20 bg-surface-container-lowest border-t border-outline-variant">
<!-- Modifier Bar -->
<div class="flex justify-between items-center p-2 bg-surface border-b border-outline-variant">
<div class="flex gap-2">
<button class="w-10 h-10 flex items-center justify-center rounded bg-surface-container text-on-surface-variant"><span class="material-symbols-outlined">touch_app</span></button>
<button class="w-10 h-10 flex items-center justify-center rounded bg-surface-container text-on-surface-variant"><span class="material-symbols-outlined">data_object</span></button>
<button class="w-10 h-10 flex items-center justify-center rounded bg-surface-container text-on-surface-variant"><span class="material-symbols-outlined">folder</span></button>
</div>
<div class="flex gap-2">
<button class="px-3 h-10 flex items-center justify-center rounded bg-surface-container text-on-surface-variant font-body-md text-[12px] leading-tight text-center">shift<br/>tab</button>
<button class="w-10 h-10 flex items-center justify-center rounded bg-surface-container text-on-surface-variant"><span class="material-symbols-outlined">settings</span></button>
<button class="w-10 h-10 flex items-center justify-center rounded bg-surface-container text-on-surface-variant"><span class="material-symbols-outlined">more_horiz</span></button>
</div>
</div>
<!-- Utility Keys Row 1 -->
<div class="flex justify-between items-center p-2 gap-1 bg-surface-container-lowest">
<button class="flex-1 h-12 flex items-center justify-center rounded bg-surface-container-highest text-on-surface"><span class="material-symbols-outlined">arrow_back</span></button>
<button class="flex-1 h-12 flex items-center justify-center rounded bg-surface-container-highest text-on-surface"><span class="material-symbols-outlined">arrow_upward</span></button>
<button class="flex-1 h-12 flex items-center justify-center rounded bg-surface-container-highest text-on-surface"><span class="material-symbols-outlined">arrow_downward</span></button>
<button class="flex-1 h-12 flex items-center justify-center rounded bg-surface-container-highest text-on-surface"><span class="material-symbols-outlined">arrow_forward</span></button>
<button class="flex-1 h-12 flex items-center justify-center rounded bg-surface-container-highest text-on-surface font-label-mono-sm border-b-2 border-primary-fixed-dim">Alt</button>
<button class="flex-1 h-12 flex items-center justify-center rounded bg-surface-container-highest text-on-surface font-label-mono-sm">Tab</button>
<button class="flex-1 h-12 flex items-center justify-center rounded bg-surface-container-highest text-on-surface font-label-mono-sm">Ins</button>
<button class="flex-1 h-12 flex items-center justify-center rounded bg-surface-container-highest text-on-surface font-label-mono-sm">Del</button>
</div>
<!-- Utility Keys Row 2 -->
<div class="flex justify-between items-center px-2 pb-2 gap-1 bg-surface-container-lowest">
<button class="flex-1 h-10 flex items-center justify-center rounded bg-surface-container text-on-surface-variant font-label-mono-sm text-[11px]">Home</button>
<button class="flex-1 h-10 flex items-center justify-center rounded bg-surface-container text-on-surface-variant font-label-mono-sm text-[11px]">PgUp</button>
<button class="flex-1 h-10 flex items-center justify-center rounded bg-surface-container text-on-surface-variant font-label-mono-sm text-[11px]">PgDn</button>
<button class="flex-1 h-10 flex items-center justify-center rounded bg-surface-container text-on-surface-variant font-label-mono-sm text-[11px]">End</button>
<button class="flex-1 h-10 flex items-center justify-center rounded bg-surface-container text-on-surface-variant font-label-mono-sm">|</button>
<button class="flex-1 h-10 flex items-center justify-center rounded bg-surface-container text-on-surface-variant font-label-mono-sm">\</button>
<button class="flex-1 h-10 flex items-center justify-center rounded bg-surface-container text-on-surface-variant font-label-mono-sm">?</button>
<button class="flex-1 h-10 flex items-center justify-center rounded bg-surface-container text-on-surface-variant font-label-mono-sm">-</button>
</div>
<!-- Standard Keyboard Placeholder (Visual cue only for design) -->
<div class="h-40 bg-[#1e232b] border-t border-outline-variant flex items-center justify-center relative">
<span class="text-on-surface-variant/50 font-body-md">Standard OS Keyboard Area</span>
<!-- Home Indicator -->
<div class="absolute bottom-2 w-1/3 h-1 bg-on-surface-variant/30 rounded-full left-1/2 -translate-x-1/2"></div>
</div>
</div>
</body></html>
